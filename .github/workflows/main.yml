
name: Railway Reservation System - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    name: Check repository setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify README exists
        run: test -f README.md

      - name: Verify repository contains tracked files
        run: |
          echo "Checking repository files..."
          git ls-files
          test -n "$(git ls-files)"

      - name: Report success
        run: echo "Repository checks passed successfully."

  backend-tests:
    name: Run backend tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-root-only
          MYSQL_DATABASE: railway_reservation_issue4_test
          MYSQL_USER: rrs_test
          MYSQL_PASSWORD: integration-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-root-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Run isolated MySQL inventory and concurrency tests
        env:
          RRS_MYSQL_TEST_HOST: 127.0.0.1
          RRS_MYSQL_TEST_PORT: 3306
          RRS_MYSQL_TEST_USER: rrs_test
          RRS_MYSQL_TEST_PASSWORD: integration-test-only
          RRS_MYSQL_TEST_DATABASE: railway_reservation_issue4_test
        run: npm run test:mysql

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
